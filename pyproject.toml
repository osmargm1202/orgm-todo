[project]
name = "orgm-todo"
version = "0.1.0"
description = "CLI de seguimiento ORGM sobre Obsidian"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
authors = [
    { name = "osmar", email = "osmargm1202@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/osmargm1202/orgm-todo"
Issues = "https://github.com/osmargm1202/orgm-todo/issues"

[project.scripts]
orgm-todo = "orgm_todo.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
