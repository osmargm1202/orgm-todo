[project]
name = "orgm-todo"
version = "0.1.0"
description = "CLI de seguimiento ORGM sobre Obsidian"
readme = "README.md"
authors = [
    { name = "osmar", email = "osmargm1202@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
orgm-todo = "orgm_todo.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
